
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Informasi Mahasiswa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #pesan {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Formulir Informasi Mahasiswa</h2>

        <form id="formMahasiswa">

            <label for="nama">Nama:</label>
            <input type="text" id="nama" name="nama"
                   placeholder="Masukkan nama lengkap"
                   required>

            <label for="nrp">NRP:</label>
            <input type="text" id="nrp" name="nrp"
                   placeholder="Masukkan 10 digit NRP"
                   maxlength="10"
                   inputmode="numeric"
                   required>

            <label for="email">Email:</label>
            <input type="text" id="email" name="email"
                   placeholder="nama@something.com"
                   required>

            <label for="matkul">Mata Kuliah:</label>
            <select id="matkul" name="matkul" required>
                <option value="">-- Pilih Mata Kuliah --</option>
                <option value="Dasar Pemrograman">
                    Dasar Pemrograman
                </option>
                <option value="Jaringan Komputer">
                    Jaringan Komputer
                </option>
                <option value="Organisasi Komputer">
                    Organisasi Komputer
                </option>
                <option value="Aljabar Linear">
                    Aljabar Linear
                </option>
                <option value="Teori Graf">
                    Teori Graf
                </option>
            </select>

            <label for="dosen">Dosen:</label>
            <select id="dosen" name="dosen" required>
                <option value="">-- Pilih Dosen --</option>
                <option value="Dr. Dwi Sunaryono, S.Kom., M.Kom.">
                    Dr. Dwi Sunaryono, S.Kom., M.Kom.
                </option>
                <option value="Fajar Baskoro, S.Kom., MT.">
                    Fajar Baskoro, S.Kom., MT.
                </option>
                <option value="Misbakhul Munir Irfan Subakti, S.Kom., M.Sc.">
                    Misbakhul Munir Irfan Subakti, S.Kom., M.Sc.
                </option>
                <option value="Agus Budi Raharjo, S.Kom., M.Kom., Ph.D.">
                    Agus Budi Raharjo, S.Kom., M.Kom., Ph.D.
                </option>
                <option value="Dr. Yudhi Purwananto, S.Kom., M.Kom.">
                    Dr. Yudhi Purwananto, S.Kom., M.Kom.
                </option>
            </select>

            <button type="submit">Kirim Data</button>

            <p id="pesan"></p>

        </form>
    </div>

    <script>
        const form = document.getElementById("formMahasiswa");
        const pesan = document.getElementById("pesan");

        form.addEventListener("submit", function(event) {

            // Mengambil nilai input
            const nrp = document.getElementById("nrp").value;
            const email = document.getElementById("email").value;

            // Validasi NRP: harus tepat 10 digit angka
            const polaNRP = /^\d{10}$/;

            // Validasi email: harus berakhir dengan @something.com
            const polaEmail = /^[^\s@]+@something\.com$/;

            // Validasi NRP
            if (!polaNRP.test(nrp)) {
                event.preventDefault();
                pesan.textContent = "NRP harus terdiri dari tepat 10 digit angka!";
                pesan.className = "error";
                return;
            }

            // Validasi email
            if (!polaEmail.test(email)) {
                event.preventDefault();
                pesan.textContent = "Email harus berakhir dengan @something.com!";
                pesan.className = "error";
                return;
            }

            // Jika semua validasi berhasil
            event.preventDefault();
            pesan.textContent = "Data mahasiswa berhasil divalidasi!";
            pesan.className = "success";

            // Menampilkan data mahasiswa di console
            console.log("Nama:", document.getElementById("nama").value);
            console.log("NRP:", nrp);
            console.log("Email:", email);
            console.log("Mata Kuliah:", document.getElementById("matkul").value);
            console.log("Dosen:", document.getElementById("dosen").value);
        });
    </script>

</body>
</html>
